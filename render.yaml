services:
  - type: web
    name: react-dex-api
    env: node
    plan: free
    buildCommand: |
      npm install
      npm run build --workspace packages/shared
      npm run build --workspace apps/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: PGHOST
        fromDatabase:
          name: react-dex-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: react-dex-db
          property: port
      - key: DEX_LIMIT_MAX
        value: "200"

  - type: web
    name: react-dex-web
    runtime: static
    buildCommand: |
      npm install
      npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://react-dex-api.onrender.com

databases:
  - name: react-dex-db
    plan: free
